<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inquiry form for Green Nursery custom projects">
    <link rel="stylesheet" href="../css/style.css">
    <title>GREEN NURSERY | INQUIRY</title>
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="site-logo">🌿 GREEN NURSERY</a>
        <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">
        <label for="menu-toggle" class="hamburger" aria-hidden="true">
            <span></span><span></span><span></span>
        </label>
        <nav aria-label="Main navigation">
            <a class="nav-link" href="../index.html">HOME</a>
            <a class="nav-link" href="./about.html">ABOUT US</a>
            <a class="nav-link" href="./products.html">PRODUCTS</a>
            <a class="nav-link" href="./services.html">SERVICES</a>
            <a class="nav-link" href="./contact.html">CONTACT US</a>
            <a class="nav-link active" href="./inquiry.html">INQUIRY</a>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <div class="form-sidebar">
                <h1>Inquiry Form</h1>
                <p class="lead-text">Have a landscape project or need bulk plant solutions? Fill in the details below and our managers will create a custom proposal for your budget.</p>
                <img class="section-img" src="../assets/INQUIRY.jpg" alt="Botanical expert managing plants in nursery">
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Tell us who you are" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Where we can reply" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="proj_type">Project Type</label>
                    <select id="proj_type" name="proj_type" required>
                        <option value="" disabled selected>-- Select an option --</option>
                        <option value="gardening-tools">Gardening Tools</option>
                        <option value="plant-care">Plant Care Services</option>
                        <option value="pottery-care">Pottery Care</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="budget">Estimated Budget (ZAR)</label>
                    <input type="number" id="budget" name="budget" min="0" placeholder="Helps us suggest the right solution" required>
                </div>

                <div class="form-group">
                    <label for="message">Detailed Message</label>
                    <textarea id="message" name="message" placeholder="Describe your workspace, plant preferences, or key questions..." required></textarea>
                </div>

                <button class="btn-submit" type="submit">Submit Inquiry ✨</button>
            </form> 
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Green Nursery. Cultivating joy, one leaf at a time.</p>
    </footer>
</body>
</html>
